<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNHAk - Modern E-Commerce</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-card:hover .product-action {
            opacity: 1;
            transform: translateY(0);
        }

        /* Cart Drawer Styles */
        #cart-drawer {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #cart-overlay {
            transition: opacity 0.3s ease;
        }

        /* Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein {
            from {
                bottom: 0;
                opacity: 0;
            }

            to {
                bottom: 30px;
                opacity: 1;
            }
        }

        @keyframes fadeout {
            from {
                bottom: 30px;
                opacity: 1;
            }

            to {
                bottom: 0;
                opacity: 0;
            }
        }
    </style>
</head>

<body class="text-slate-800 antialiased min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Cart Overlay -->
    <div id="cart-overlay" onclick="toggleCart(false)"
        class="fixed inset-0 bg-black/50 z-50 opacity-0 pointer-events-none"></div>

    <!-- Cart Drawer -->
    <div id="cart-drawer"
        class="fixed top-0 right-0 h-full w-full max-w-md bg-white z-[60] shadow-2xl translate-x-full flex flex-col">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
            <h2 class="text-xl font-bold text-slate-900">Your Cart</h2>
            <button onclick="toggleCart(false)" class="p-2 text-slate-400 hover:text-slate-900 transition">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Items injected via JS -->
        </div>

        <div id="cart-footer" class="p-6 border-t border-slate-100 bg-slate-50">
            <div class="flex items-center justify-between mb-4">
                <span class="text-slate-500 font-medium">Subtotal</span>
                <span id="cart-subtotal" class="text-xl font-bold text-slate-900">$0.00</span>
            </div>
            <p class="text-xs text-slate-400 mb-6 text-center uppercase tracking-widest">Taxes and shipping calculated
                at checkout</p>
            <button onclick="showToast('Checkout feature coming soon!')"
                class="w-full bg-brand-600 text-white font-bold py-4 rounded-xl hover:bg-brand-700 transition shadow-lg shadow-brand-500/20">
                Checkout Now
            </button>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16 gap-4">
                <!-- Logo -->
                <div class="flex items-center cursor-pointer flex-shrink-0" onclick="router('home')">
                    <div class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center mr-2">
                        <i class="fa-solid fa-bolt text-white text-sm"></i>
                    </div>
                    <span class="font-bold text-xl tracking-tight text-slate-900 hidden sm:block">UNHAk</span>
                </div>

                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center space-x-6 flex-shrink-0">
                    <a href="#" onclick="router('home')"
                        class="text-slate-600 hover:text-brand-600 font-medium transition">Home</a>
                    <a href="#" onclick="router('home')"
                        class="text-slate-600 hover:text-brand-600 font-medium transition">Shop</a>
                    <a href="#" onclick="router('profile')" id="nav-profile-link"
                        class="hidden text-slate-600 hover:text-brand-600 font-medium transition">Profile</a>
                </div>

                <!-- Search Bar -->
                <div class="flex-1 max-w-lg">
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i
                                class="fa-solid fa-magnifying-glass text-slate-400 group-focus-within:text-brand-500 transition-colors"></i>
                        </div>
                        <input type="text" id="global-search" placeholder="Search products..."
                            class="block w-full pl-10 pr-3 py-2 border border-slate-200 rounded-full leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-brand-500 focus:border-transparent sm:text-sm transition-all duration-200 shadow-sm"
                            oninput="handleSearch(this.value)">
                    </div>
                </div>

                <!-- Right Side Actions -->
                <div class="flex items-center space-x-2 sm:space-x-4 flex-shrink-0">
                    <button onclick="toggleCart(true)"
                        class="relative p-2 text-slate-500 hover:text-brand-600 transition">
                        <i class="fa-solid fa-cart-shopping text-lg"></i>
                        <span id="cart-count"
                            class="absolute top-0 right-0 inline-flex items-center justify-center px-1.5 py-0.5 text-xs font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-brand-600 rounded-full">0</span>
                    </button>

                    <div id="auth-buttons">
                        <!-- Injected via JS -->
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app" class="flex-grow">
        <!-- Views will be injected here -->
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto">
        <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
            <div class="md:flex md:items-center md:justify-between">
                <div class="flex justify-center md:justify-start space-x-6 md:order-2">
                    <a href="#" class="text-slate-400 hover:text-brand-500"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#" class="text-slate-400 hover:text-brand-500"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" class="text-slate-400 hover:text-brand-500"><i class="fa-brands fa-twitter"></i></a>
                </div>
                <div class="mt-8 md:mt-0 md:order-1">
                    <p class="text-center text-sm text-slate-500">&copy; 2024 UNHAk Inc. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Toast Component -->
    <div id="toast">Notification Message</div>

    <!-- JavaScript Logic -->
    <script>
        // --- State Management ---
        const state = {
            currentUser: null,
            cart: [],
            searchQuery: '',
            products: [
                { id: 1, name: "Minimalist Watch", price: 129.00, category: "Accessories", image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&q=80&w=500" },
                { id: 2, name: "Premium Headphones", price: 249.00, category: "Electronics", image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&q=80&w=500" },
                { id: 3, name: "Ergonomic Chair", price: 399.00, category: "Furniture", image: "https://images.unsplash.com/photo-1592078615290-033ee584e267?auto=format&fit=crop&q=80&w=500" },
                { id: 4, name: "Mechanical Keyboard", price: 159.00, category: "Electronics", image: "https://images.unsplash.com/photo-1626958390898-162d3577f293?auto=format&fit=crop&q=80&w=500" },
                { id: 5, name: "Designer Backpack", price: 89.00, category: "Fashion", image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&q=80&w=500" },
                { id: 6, name: "Smart Lamp", price: 49.00, category: "Home", image: "https://images.unsplash.com/photo-1571406487954-dc11b0c0767d?auto=format&fit=crop&q=80&w=500" },
                { id: 7, name: "Running Shoes", price: 119.00, category: "Fashion", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&q=80&w=500" },
                { id: 8, name: "Digital Camera", price: 599.00, category: "Electronics", image: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&q=80&w=500" },
            ]
        };

        // --- Helper Functions ---
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
        }

        // --- Cart Management Functions ---
        function toggleCart(isOpen) {
            const drawer = document.getElementById('cart-drawer');
            const overlay = document.getElementById('cart-overlay');
            if (isOpen) {
                drawer.classList.remove('translate-x-full');
                overlay.classList.remove('pointer-events-none');
                overlay.classList.add('opacity-100');
                renderCart();
            } else {
                drawer.classList.add('translate-x-full');
                overlay.classList.add('pointer-events-none');
                overlay.classList.remove('opacity-100');
            }
        }

        function renderCart() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartSubtotal = document.getElementById('cart-subtotal');
            const cartCount = document.getElementById('cart-count');

            cartCount.textContent = state.cart.length;

            if (state.cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-400 space-y-4">
                        <i class="fa-solid fa-basket-shopping text-6xl opacity-20"></i>
                        <p class="font-medium text-lg">Your cart is empty</p>
                        <button onclick="toggleCart(false)" class="text-brand-600 font-semibold hover:underline">Continue Shopping</button>
                    </div>
                `;
                cartSubtotal.textContent = formatCurrency(0);
                return;
            }

            let subtotal = 0;
            cartItemsContainer.innerHTML = state.cart.map((item, index) => {
                subtotal += item.price;
                return `
                    <div class="flex gap-4 fade-in">
                        <img src="${item.image}" class="w-20 h-20 object-cover rounded-xl bg-slate-50" alt="${item.name}">
                        <div class="flex-1">
                            <h4 class="font-bold text-slate-900 leading-tight mb-1">${item.name}</h4>
                            <p class="text-xs text-slate-500 uppercase tracking-wider mb-2">${item.category}</p>
                            <div class="flex items-center justify-between">
                                <span class="font-bold text-slate-900">${formatCurrency(item.price)}</span>
                                <button onclick="removeFromCart(${index})" class="text-xs text-red-500 font-medium hover:text-red-700 transition">
                                    <i class="fa-solid fa-trash-can mr-1"></i> Remove
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            cartSubtotal.textContent = formatCurrency(subtotal);
        }

        function addToCart(productId) {
            const product = state.products.find(p => p.id === productId);
            if (product) {
                // Add to state
                state.cart.push({ ...product });
                // Update Badge
                renderNavigation();
                // Feedback
                showToast(`${product.name} added to cart!`);
                // Open drawer to show progress
                toggleCart(true);
            }
        }

        function removeFromCart(index) {
            state.cart.splice(index, 1);
            renderCart();
            renderNavigation();
            showToast("Item removed");
        }

        // --- Core Application Logic ---

        function init() {
            renderNavigation();
            router('home');
        }

        function router(page) {
            const app = document.getElementById('app');
            state.currentPage = page;
            window.scrollTo(0, 0);

            if (page === 'profile' && !state.currentUser) {
                showToast("Please login to view your profile");
                router('login');
                return;
            }

            switch (page) {
                case 'home':
                    app.innerHTML = renderHome();
                    if (state.searchQuery) handleSearch(state.searchQuery);
                    break;
                case 'login':
                    app.innerHTML = renderLogin();
                    break;
                case 'profile':
                    app.innerHTML = renderProfile();
                    break;
                default:
                    app.innerHTML = renderHome();
            }
        }

        // --- Render Functions ---

        function renderNavigation() {
            const authContainer = document.getElementById('auth-buttons');
            const profileLink = document.getElementById('nav-profile-link');
            const cartCount = document.getElementById('cart-count');

            cartCount.textContent = state.cart.length;

            if (state.currentUser) {
                profileLink.classList.remove('hidden');
                authContainer.innerHTML = `
                    <div class="flex items-center gap-3">
                        <button onclick="router('profile')" class="flex items-center text-sm font-medium text-slate-700 hover:text-brand-600">
                             <img src="${state.currentUser.avatar}" class="w-8 h-8 rounded-full border border-slate-200 mr-2" alt="Avatar">
                             <span class="hidden md:inline">${state.currentUser.name}</span>
                        </button>
                        <button onclick="handleLogout()" class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">
                            <span class="hidden sm:inline">Logout</span>
                            <i class="fa-solid fa-right-from-bracket sm:hidden"></i>
                        </button>
                    </div>
                `;
            } else {
                profileLink.classList.add('hidden');
                authContainer.innerHTML = `
                    <button onclick="router('login')" class="px-5 py-2 text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow-sm transition">
                        Log In
                    </button>
                `;
            }
        }

        function renderHome() {
            const productsHtml = state.products.map(product => `
                <div class="group bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-all duration-300 overflow-hidden product-card" 
                     data-name="${product.name.toLowerCase()}" 
                     data-category="${product.category.toLowerCase()}">
                    <div class="relative h-64 bg-slate-100 overflow-hidden">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <button onclick="addToCart(${product.id})" class="product-action absolute bottom-4 right-4 bg-white text-slate-900 p-3 rounded-full shadow-lg opacity-0 transform translate-y-4 transition-all duration-300 hover:bg-brand-600 hover:text-white">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                    <div class="p-5">
                        <p class="text-xs font-semibold text-brand-600 uppercase tracking-wider mb-1">${product.category}</p>
                        <h3 class="text-lg font-bold text-slate-900 mb-1">${product.name}</h3>
                        <div class="flex items-center justify-between mt-3">
                            <span class="text-xl font-bold text-slate-900">${formatCurrency(product.price)}</span>
                            <div class="flex text-yellow-400 text-xs">
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star-half-stroke"></i>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            return `
                <div class="fade-in">
                    <!-- Hero -->
                    <section class="relative bg-slate-900 text-white py-20 px-4 sm:px-6 lg:px-8 overflow-hidden">
                        <div class="absolute inset-0">
                            <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&q=80&w=1200" class="w-full h-full object-cover opacity-30">
                        </div>
                        <div class="relative max-w-7xl mx-auto text-center">
                            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-6 uppercase">Modern Standards</h1>
                            <p class="text-xl text-slate-300 mb-8 max-w-2xl mx-auto italic">Quality you can feel, design you can see. Welcome to UNHAk.</p>
                            <button onclick="document.getElementById('products-grid').scrollIntoView({behavior: 'smooth'})" class="inline-block bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 px-8 rounded-full transition shadow-lg shadow-brand-500/30">
                                Browse Shop
                            </button>
                        </div>
                    </section>

                    <!-- Product Section -->
                    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12 mb-8">
                        <div class="flex items-center justify-between">
                            <h2 class="text-2xl font-bold text-slate-900">Featured Items</h2>
                            <div class="flex gap-2">
                                <span class="text-xs bg-slate-200 text-slate-600 px-2 py-1 rounded">8 Items Total</span>
                            </div>
                        </div>
                        <div id="no-results" class="hidden py-12 text-center text-slate-500 bg-slate-50 rounded-2xl mt-4 border border-dashed border-slate-300">
                            <i class="fa-solid fa-search-minus text-4xl mb-4 opacity-30"></i>
                            <p>No products found matching your search.</p>
                        </div>
                    </section>

                    <section id="products-grid" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                            ${productsHtml}
                        </div>
                    </section>
                </div>
            `;
        }

        function renderLogin() {
            return `
                <div class="fade-in min-h-[calc(100vh-64px)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-slate-50">
                    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl border border-slate-100">
                        <div class="text-center">
                            <h2 class="text-3xl font-extrabold text-slate-900">Sign In to UNHAk</h2>
                            <p class="mt-2 text-sm text-slate-600">Enter your credentials below</p>
                        </div>
                        <form class="mt-8 space-y-6" onsubmit="handleLogin(event)">
                            <div class="space-y-4">
                                <input id="email-address" type="email" required class="block w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-brand-500 focus:border-brand-500" placeholder="user@unhak.com" value="user@unhak.com">
                                <input id="password" type="password" required class="block w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-brand-500 focus:border-brand-500" placeholder="Password" value="password123">
                            </div>
                            <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-brand-600 hover:bg-brand-700 shadow-lg shadow-brand-500/30 transition-all">
                                Sign in
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderProfile() {
            if (!state.currentUser) return '';
            return `
                <div class="fade-in max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-8 text-center max-w-2xl mx-auto">
                        <img src="${state.currentUser.avatar}" alt="Avatar" class="w-32 h-32 rounded-full mx-auto mb-6 border-8 border-slate-50">
                        <h2 class="text-3xl font-bold text-slate-900">${state.currentUser.name}</h2>
                        <p class="text-slate-500 mb-8">${state.currentUser.email}</p>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="p-4 bg-slate-50 rounded-2xl">
                                <span class="block text-2xl font-bold text-slate-900">${state.cart.length}</span>
                                <span class="text-xs text-slate-500 uppercase">Items in Cart</span>
                            </div>
                            <div class="p-4 bg-slate-50 rounded-2xl">
                                <span class="block text-2xl font-bold text-slate-900">12</span>
                                <span class="text-xs text-slate-500 uppercase">Previous Orders</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Search Logic ---
        function handleSearch(query) {
            state.searchQuery = query.toLowerCase();
            const grid = document.getElementById('products-grid');
            if (!grid && state.currentPage !== 'home') {
                router('home');
                return;
            }

            const products = document.querySelectorAll('.product-card');
            let hasResults = false;

            products.forEach(card => {
                const name = card.dataset.name;
                const category = card.dataset.category;
                if (name.includes(state.searchQuery) || category.includes(state.searchQuery)) {
                    card.style.display = '';
                    card.classList.remove('hidden');
                    hasResults = true;
                } else {
                    card.classList.add('hidden');
                }
            });

            const noResultsMsg = document.getElementById('no-results');
            if (noResultsMsg) {
                if (!hasResults && products.length > 0) {
                    noResultsMsg.classList.remove('hidden');
                } else {
                    noResultsMsg.classList.add('hidden');
                }
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.innerText = "Signing in...";
            submitBtn.disabled = true;

            setTimeout(() => {
                const email = document.getElementById('email-address').value;
                const name = email.split('@')[0];
                state.currentUser = {
                    name: name.charAt(0).toUpperCase() + name.slice(1),
                    email: email,
                    avatar: `https://ui-avatars.com/api/?name=${name}&background=0ea5e9&color=fff`
                };
                renderNavigation();
                router('profile');
                showToast(`Welcome to UNHAk, ${state.currentUser.name}!`);
            }, 800);
        }

        function handleLogout() {
            state.currentUser = null;
            renderNavigation();
            router('login');
            showToast("Logged out successfully.");
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
